[package]
name = "ottplay-tauri"
version = "1.1.5"
description = "Tauri desktop shell for ottplay-foss (Mode B), reusing ottplay-core"
edition = "2021"
authors = ["4alvit <4alvit@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/4alvit/ottplay-foss"

[lib]
name = "ottplay_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }
tracing = "0.1"
anyhow = "1"
ottplay-core = { path = "../src-rs/core" }
tiny_http = "0.12.0"
url = "2.5.8"
md5 = "0.7"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# OS MediaSession / MPRIS / Now Playing / SMTC for Mode B lock-screen style controls.
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
raw-window-handle = "0.6"

# Required for production embed of frontendDist. Plain `cargo build`
# without this leaves cfg(dev) on and never embeds assets (white screen).
# `tauri build` also injects tauri/custom-protocol; keep the crate feature so
# release cargo builds embed correctly too.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
