[package]
name = "ottplay-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ottplay-server"
path = "src/main.rs"

[dependencies]
ottplay-core = { path = "../core" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
reqwest = { version = "0.12", features = ["json"] }
quick-xml = "0.36"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
once_cell = "1"
serde_json = "1"
urlencoding = "2"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
chrono = "0.4"
hyper = "1"
hyper-util = { version = "0.1", features = ["server", "tokio"] }
tower = "0.5"
