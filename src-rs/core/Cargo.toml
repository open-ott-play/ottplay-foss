[package]
name = "ottplay-core"
version = "0.1.0"
edition = "2021"

[lib]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
quick-xml = "0.41"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
anyhow = "1"
chrono = "0.4"
regex = "1"
serde_json = "1"
urlencoding = "2"
