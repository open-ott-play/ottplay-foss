<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="260" viewBox="0 0 1080 260" role="img" aria-labelledby="title description">
<title id="title">Verified remote provider settings transaction</title>
<desc id="description">A typed command passes runtime, source and revision guards. The provider codec prepares the value, a storage transaction verifies it, then the player invalidates affected state and returns a receipt.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b2d"/><stop offset="1" stop-color="#172b42"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#68d4bf"/></marker></defs>
<rect width="1080" height="260" rx="20" fill="url(#bg)"/>
<g font-family="system-ui, sans-serif"><text x="32" y="44" fill="#f1f6ff" font-size="24" font-weight="650">A receipt confirms saved state</text><text x="32" y="72" fill="#b7c7dc" font-size="15">No provider switch, wake-up or playback is implied.</text>
<g fill="#21354b" stroke="#68d4bf" stroke-width="1"><rect x="32" y="102" width="180" height="90" rx="12"/><rect x="241" y="102" width="180" height="90" rx="12"/><rect x="450" y="102" width="180" height="90" rx="12"/><rect x="659" y="102" width="180" height="90" rx="12"/><rect x="868" y="102" width="180" height="90" rx="12"/></g>
<g stroke="#68d4bf" stroke-width="2" marker-end="url(#arrow)"><path d="M215 147H234"/><path d="M424 147H443"/><path d="M633 147H652"/><path d="M842 147H861"/></g>
<g fill="#eef5ff" font-size="17" font-weight="600" text-anchor="middle"><text x="122" y="134">Typed command</text><text x="331" y="134">Context guards</text><text x="540" y="134">Provider codec</text><text x="749" y="134">Verified save</text><text x="958" y="134">Apply and report</text></g>
<g fill="#b7c7dc" font-size="13" text-anchor="middle"><text x="122" y="160">Schema, type, limits</text><text x="331" y="160">Runtime · source · revision</text><text x="540" y="160">Normal validation</text><text x="749" y="160">Transaction + readback</text><text x="958" y="160">Explicit effect status</text><text x="122" y="178">Secrets remain redacted</text><text x="331" y="178">Conflicts stop the write</text><text x="540" y="178">No arbitrary storage key</text><text x="749" y="178">Before cache invalidation</text><text x="958" y="178">No automatic retry</text></g>
<text x="32" y="231" fill="#68d4bf" font-size="14">Plex collections: 10 entries per page · 1000 selected roots · an empty selection includes all libraries</text></g></svg>
