<svg
    aria-labelledby="title desc"
    height="640"
    role="img"
    viewBox="0 0 1100 640"
    width="1100"
    xmlns="http://www.w3.org/2000/svg"
>
    <title id="title">
        OTT-play on LG: hosted and native application paths
    </title>
    <desc id="desc">
        The hosted application loads the common web player through the LG web
        engine. OTTPlay Native installs a Rust and SDL OpenGL ES interface and
        uses FFmpeg demuxing and LG's hardware video decoder. Both obtain media
        from a Plex server. The native package has its own application identity
        and profile storage.
    </desc>
    <defs>
        <linearGradient id="bg" x2="1" y2="1">
            <stop stop-color="#102039" />
            <stop offset="1" stop-color="#081019" />
        </linearGradient>
        <marker
            id="arrow"
            markerHeight="7"
            markerWidth="7"
            orient="auto-start-reverse"
            refX="8"
            refY="5"
            viewBox="0 0 10 10"
        >
            <path d="M0 0L10 5L0 10Z" fill="#8ca5bc" />
        </marker>
        <style>
        text {
            font-family: Arial, sans-serif;
            fill: #edf4ff;
        }
        .muted {
            font-size: 16px;
            fill: #afbed0;
        }
        .heading {
            font-size: 24px;
            font-weight: 700;
        }
        .label {
            font-size: 19px;
            font-weight: 600;
        }
        .line {
            fill: none;
            stroke: #8ca5bc;
            stroke-width: 2;
            marker-end: url(#arrow);
        }
        </style>
    </defs>
    <rect fill="#102039" height="640" rx="24" width="1100" />
    <text fill="#edf4ff" font-size="30" font-weight="750" x="48" y="58">
        Two LG applications, two rendering paths
    </text>
    <text class="muted" fill="#edf4ff" x="48" y="90">
        Separate installs and storage • Plex remains the media server
    </text>
    <rect
        fill="#15273d"
        height="374"
        rx="18"
        stroke="#3f648a"
        width="470"
        x="40"
        y="120"
    />
    <rect
        fill="#102b2b"
        height="374"
        rx="18"
        stroke="#3b9c90"
        width="510"
        x="550"
        y="120"
    />
    <text class="heading" fill="#edf4ff" x="66" y="160">Hosted OTT-play</text>
    <text class="heading" fill="#edf4ff" x="576" y="160">
        OTTPlay Native • Plex target
    </text>
    <text class="muted" fill="#edf4ff" x="66" y="188">
        com.openottplay.player
    </text>
    <text class="muted" fill="#edf4ff" x="576" y="188">
        com.openottplay.player.native
    </text>
    <rect fill="#233d59" height="62" rx="10" width="418" x="66" y="214" />
    <text class="label" fill="#edf4ff" x="85" y="241">
        Common web interface + providers
    </text>
    <text class="muted" fill="#edf4ff" x="85" y="264">
        Downloaded from player.ottplay.here.now
    </text>
    <path
        class="line"
        d="M275 281v27"
        fill="none"
        stroke="#8ca5bc"
        stroke-width="2"
    />
    <rect fill="#233d59" height="62" rx="10" width="418" x="66" y="315" />
    <text class="label" fill="#edf4ff" x="85" y="342">LG web engine</text>
    <text class="muted" fill="#edf4ff" x="85" y="365">
        HTML / CSS / JavaScript / browser media
    </text>
    <path
        class="line"
        d="M275 382v27"
        fill="none"
        stroke="#8ca5bc"
        stroke-width="2"
    />
    <text class="label" fill="#edf4ff" x="86" y="445">
        TV display + media APIs
    </text>
    <rect fill="#18423e" height="62" rx="10" width="458" x="576" y="214" />
    <text class="label" fill="#edf4ff" x="595" y="241">
        Rust + SDL2 / OpenGL ES interface
    </text>
    <text class="muted" fill="#edf4ff" x="595" y="264">
        Installed assets • no WebView / Chromium
    </text>
    <path
        class="line"
        d="M805 281v27"
        fill="none"
        stroke="#8ca5bc"
        stroke-width="2"
    />
    <rect fill="#18423e" height="62" rx="10" width="458" x="576" y="315" />
    <text class="label" fill="#edf4ff" x="595" y="342">
        Native Plex client + FFmpeg demux
    </text>
    <text class="muted" fill="#edf4ff" x="595" y="365">
        Media selection, resume, tracks and subtitles
    </text>
    <path
        class="line"
        d="M805 382v27"
        fill="none"
        stroke="#8ca5bc"
        stroke-width="2"
    />
    <text class="label" fill="#edf4ff" x="595" y="445">
        LG hardware decoder + video plane
    </text>
    <rect
        fill="#343050"
        height="64"
        rx="13"
        stroke="#8d81c7"
        width="640"
        x="230"
        y="531"
    />
    <text class="label" fill="#edf4ff" text-anchor="middle" x="550" y="558">
        Plex server
    </text>
    <text class="muted" fill="#edf4ff" text-anchor="middle" x="550" y="582">
        Library, original media or server transcoding
    </text>
    <path
        class="line"
        d="M370 529V501"
        fill="none"
        stroke="#8ca5bc"
        stroke-width="2"
    />
    <path
        class="line"
        d="M730 529V501"
        fill="none"
        stroke="#8ca5bc"
        stroke-width="2"
    />
    <text class="muted" fill="#edf4ff" text-anchor="middle" x="550" y="620">
        Native compilation does not prove playback compatibility on every LG
        model.
    </text>
</svg>
