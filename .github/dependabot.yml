version: 2
updates:
  - package-ecosystem: npm
    # The classic browser/STB compiler must keep ES5 emit and its JavaScript API.
    # TypeScript 6 deprecates ES5; TypeScript 7 removes it.
    ignore:
      - dependency-name: typescript
        versions: [">=6"]
      # The shipped, unmodified UMD must retain ES5 for legacy TVs.
      # Video.js 8 / VHS 3 require newer syntax; see docs/es5-compatibility.md.
      - dependency-name: video.js
        versions: [">=8"]
      - dependency-name: "@videojs/http-streaming"
        versions: [">=3"]
    # The media manifest hashes the complete lockfile. Refresh generated media
    # with npm run build:media before merging this dependency batch.
    groups:
      npm-lockfile:
        patterns:
          - "*"
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
