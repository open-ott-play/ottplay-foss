# Temporary Linux seek diagnosis only. Never merge this workflow replacement.
name: Native Shells
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
env:
  SOURCE_SHA: 45216821ed2d8284a59b8e0c7d83269ad2373054
  CI: '1'
defaults:
  run:
    shell: bash
jobs:
  linux-seek:
    name: Five scenarios / ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - variant: baseline
          os: ubuntu-24.04
        - variant: natural-resume
          os: ubuntu-24.04
        - variant: await-seeked
          os: ubuntu-24.04
    env:
      FIXTURE: final-headers-linux
      FIXTURE_SHA: 89221396d441e533f0af0bea3745401846de472a
      SEEK_VARIANT: ${{ matrix.variant }}
      TOOLCHAIN: playwright-1-64-0
      PLAYWRIGHT_VERSION: 1.64.0
      BROWSER_VERSION: '27.2'
      CI_BROWSER_TARGET_ID: ubuntu-latest-webkit-1-64-0
      CI_BROWSER_ENGINE: webkit
      CI_BROWSER_CHANNEL: ''
    steps:
    - name: Audit outbound calls
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Bind source and unchanged original assertions
      run: |
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git fetch --no-tags origin "$SOURCE_SHA"
        test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$(git rev-parse "$FIXTURE_SHA^{tree}")"
        for file in tests/browser/plex-provider.spec.cjs tests/helpers/browser-test.cjs playwright.compatibility.config.cjs scripts/prepare_browser_candidate.py package-lock.json playwright.config.cjs "tools/browser-compatibility/$TOOLCHAIN/package.json" "tools/browser-compatibility/$TOOLCHAIN/package-lock.json"; do
          test "$(git rev-parse "$SOURCE_SHA:$file")" = "$(git rev-parse "HEAD:$file")"
        done
        python - <<'CHECK'
        import os,subprocess
        changed=subprocess.check_output(['git','diff','--name-only',os.environ['FIXTURE_SHA'],'HEAD'],text=True).splitlines()
        assert changed==['.github/workflows/native-parity.yml','scripts/foss-seek-diagnostic.py']
        CHECK
    - name: Download exact failed PR artifact for diagnosis only
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p browser-candidate .compatibility
        # The raw ZIP digest is checked before any extraction.
        gh api repos/open-ott-play/ottplay-foss/actions/artifacts/12033189997 > .compatibility/artifact.json
        gh api repos/open-ott-play/ottplay-foss/actions/artifacts/12033189997/zip > .compatibility/candidate.zip
        python - <<'CHECK'
        import hashlib,json,zipfile
        from pathlib import Path,PurePosixPath
        m=json.loads(Path('.compatibility/artifact.json').read_text())
        assert m['id']==12033189997 and m['name']=='ottplay-foss-modea-45216821ed2d8284a59b8e0c7d83269ad2373054' and not m['expired']
        assert m['workflow_run']['id']==38870073578 and m['workflow_run']['head_sha']=='89221396d441e533f0af0bea3745401846de472a'
        expected='d52092590819b3fcdd3e9f313f4fd0d159c4af58edab677f7f848bf723dced96'
        assert m['digest']=='sha256:'+expected
        zip_path=Path('.compatibility/candidate.zip')
        assert zip_path.stat().st_size <= 50*1024*1024
        assert hashlib.sha256(zip_path.read_bytes()).hexdigest()==expected
        with zipfile.ZipFile(zip_path) as z:
         entries=z.infolist(); assert len(entries)<=100
         assert sum(i.file_size for i in entries)<=100*1024*1024
         names=set()
         for i in entries:
          p=PurePosixPath(i.filename)
          assert len(p.parts)==1 and p.name==i.filename and p.name not in ('.','..') and '\\' not in i.filename
          assert p.name not in names; names.add(p.name)
          assert (i.external_attr>>16)&0o170000 in (0,0o100000)
          assert i.file_size<=50*1024*1024
          Path('browser-candidate',p.name).write_bytes(z.read(i))
        archive=Path('browser-candidate/ottplay-foss-modea.tar.gz')
        assert hashlib.sha256(archive.read_bytes()).hexdigest()=='081cf437a0648457e045d0b45c3b6943dd797d5f060e7ccef8fdc172cb830c9c'
        CHECK
    - name: Install locked dependencies and exact browser generation
      run: |
        npm ci --omit=dev --ignore-scripts
        npm ci --ignore-scripts --prefix "tools/browser-compatibility/$TOOLCHAIN"
        node "tools/browser-compatibility/$TOOLCHAIN/node_modules/playwright/cli.js" install --with-deps webkit
    - name: Set diagnostic paths
      run: |
        node <<'NODE'
        const fs=require('node:fs'),path=require('node:path');
        const output=path.resolve('.compatibility/results');fs.mkdirSync(output,{recursive:true});
        fs.appendFileSync(process.env.GITHUB_ENV,[
         'CI_PLAYWRIGHT_MODULE='+path.resolve('tools/browser-compatibility/'+process.env.TOOLCHAIN+'/node_modules/playwright'),
         'CI_BROWSER_DIAGNOSTICS='+output,'CI_BROWSER_EVIDENCE='+path.join(output,'result.json')].join('\n')+'\n');
        NODE
    - name: Verify actual immutable packaged runtime without rebuilding
      run: GITHUB_SHA="$SOURCE_SHA" python scripts/prepare_browser_candidate.py browser-candidate browser-candidate-web
    - name: Bind actual browser and diagnostic identity
      run: |
        node <<'NODE'
        const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict');
        (async()=>{
         const modulePath=process.env.CI_PLAYWRIGHT_MODULE;
         const version=require(path.join(modulePath,'package.json')).version;
         assert.equal(process.arch,'x64');
         assert.equal(version,process.env.PLAYWRIGHT_VERSION);
         assert.equal(require(path.join(modulePath,'../playwright-core/package.json')).version,version);
         assert.equal(process.platform,process.env.CI_BROWSER_TARGET_ID.startsWith('macos-')?'darwin':'linux');
         const browser=await require(modulePath).webkit.launch({headless:true});
         try {
          assert.equal(browser.version(),process.env.BROWSER_VERSION);
          fs.writeFileSync(path.join(process.env.CI_BROWSER_DIAGNOSTICS,'runtime.json'),JSON.stringify({
           schema:1,diagnosticOnly:true,scope:'linux-seek-discriminator',seekVariant:process.env.SEEK_VARIANT,actualArch:process.arch,osRelease:require('node:os').release(),osVersion:require('node:os').version(),fixture:process.env.FIXTURE,fixtureSourceSha:process.env.FIXTURE_SHA,
           target:process.env.CI_BROWSER_TARGET_ID,engine:'webkit',channel:'',playwrightVersion:version,
           browserVersion:browser.version(),platform:process.platform,sourceSha:process.env.SOURCE_SHA,
           workflowSha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,
           releaseChannel:'',candidateArtifactId:'12033189997',candidateRunId:'38870073578',
          },null,2));
         } finally {await browser.close();}
        })().catch(e=>{console.error(e);process.exitCode=1});
        NODE
        if command -v dpkg-query >/dev/null; then dpkg-query -W '*gstreamer*' > .compatibility/gstreamer-versions.txt; fi
    - name: Apply the exact diagnostic-only seek variation
      run: |
        python scripts/foss-seek-diagnostic.py "$SEEK_VARIANT"
        node --check tests/browser/plex-provider.spec.cjs
    - name: Run all five unchanged assertions once
      env:
        DEBUG: pw:browser
        GST_DEBUG: '3'
      run: |
        node scripts/browser-acceptance.cjs
    - name: Verify only the declared diagnostic transformation occurred
      if: ${{ always() }}
      run: |
        python - <<'CHECK'
        import hashlib,json,os,subprocess
        from pathlib import Path
        evidence=Path(os.environ['CI_BROWSER_DIAGNOSTICS'])/'seek-variant.json'
        if evidence.exists():
         record=json.loads(evidence.read_text())
         assert record['variant']==os.environ['SEEK_VARIANT']
         assert hashlib.sha256(Path('tests/browser/plex-provider.spec.cjs').read_bytes()).hexdigest()==record['transformed_spec_sha256']
         assert subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()==['tests/browser/plex-provider.spec.cjs']
        CHECK
    - name: Preserve diagnostic evidence, including failures
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: foss-linux-seek-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .compatibility/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
