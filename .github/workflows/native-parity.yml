# Temporary coherent official runtime comparison only. Never merge this replacement.
name: Native Shells
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
env:
  SOURCE_SHA: 45216821ed2d8284a59b8e0c7d83269ad2373054
  CI: '1'
defaults:
  run:
    shell: bash
jobs:
  runtime-generation:
    name: Original five scenarios x4 / ${{ matrix.generation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - generation: noble
          image: mcr.microsoft.com/playwright@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
        - generation: resolute
          image: mcr.microsoft.com/playwright@sha256:2c4fd97c99d2377e7767ee3c6a86c9fa1e944600d4b198a09a5f235330f498ae
    env:
      FIXTURE_SHA: 89221396d441e533f0af0bea3745401846de472a
      RUNTIME_IMAGE: ${{ matrix.image }}
      RUNTIME_GENERATION: ${{ matrix.generation }}
      TOOLCHAIN: playwright-1-64-0
      PLAYWRIGHT_VERSION: 1.64.0
      BROWSER_VERSION: '27.2'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Bind source and unchanged original assertions
      run: "test \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\ngit fetch --no-tags origin \"$SOURCE_SHA\"\ntest \"$(git rev-parse \"$SOURCE_SHA^{tree}\")\" = \"$(git rev-parse \"$FIXTURE_SHA^{tree}\")\"\nfor file in tests/browser/plex-provider.spec.cjs tests/helpers/browser-test.cjs playwright.compatibility.config.cjs scripts/prepare_browser_candidate.py package-lock.json playwright.config.cjs \"tools/browser-compatibility/$TOOLCHAIN/package.json\" \"tools/browser-compatibility/$TOOLCHAIN/package-lock.json\"; do\n  test \"$(git rev-parse \"$SOURCE_SHA:$file\")\" = \"$(git rev-parse \"HEAD:$file\")\"\ndone\npython - <<'CHECK'\nimport os,subprocess\nchanged=subprocess.check_output(['git','diff','--name-only',os.environ['FIXTURE_SHA'],'HEAD'],text=True).splitlines()\nassert changed==['.github/workflows/native-parity.yml','scripts/foss-runtime-generation.py']\nCHECK\n"
    - name: Download exact failed PR artifact for diagnosis only
      env:
        GH_TOKEN: ${{ github.token }}
      run: "mkdir -p browser-candidate .compatibility\n# The raw ZIP digest is checked before any extraction.\ngh api repos/open-ott-play/ottplay-foss/actions/artifacts/12033189997 > .compatibility/artifact.json\ngh api repos/open-ott-play/ottplay-foss/actions/artifacts/12033189997/zip > .compatibility/candidate.zip\npython - <<'CHECK'\nimport hashlib,json,zipfile\nfrom pathlib import Path,PurePosixPath\nm=json.loads(Path('.compatibility/artifact.json').read_text())\nassert m['id']==12033189997 and m['name']=='ottplay-foss-modea-45216821ed2d8284a59b8e0c7d83269ad2373054' and not m['expired']\nassert m['workflow_run']['id']==38870073578 and m['workflow_run']['head_sha']=='89221396d441e533f0af0bea3745401846de472a'\nexpected='d52092590819b3fcdd3e9f313f4fd0d159c4af58edab677f7f848bf723dced96'\nassert m['digest']=='sha256:'+expected\nzip_path=Path('.compatibility/candidate.zip')\nassert zip_path.stat().st_size <= 50*1024*1024\nassert hashlib.sha256(zip_path.read_bytes()).hexdigest()==expected\n\
        with zipfile.ZipFile(zip_path) as z:\n entries=z.infolist(); assert len(entries)<=100\n assert sum(i.file_size for i in entries)<=100*1024*1024\n names=set()\n for i in entries:\n  p=PurePosixPath(i.filename)\n  assert len(p.parts)==1 and p.name==i.filename and p.name not in ('.','..') and '\\\\' not in i.filename\n  assert p.name not in names; names.add(p.name)\n  assert (i.external_attr>>16)&0o170000 in (0,0o100000)\n  assert i.file_size<=50*1024*1024\n  Path('browser-candidate',p.name).write_bytes(z.read(i))\narchive=Path('browser-candidate/ottplay-foss-modea.tar.gz')\nassert hashlib.sha256(archive.read_bytes()).hexdigest()=='081cf437a0648457e045d0b45c3b6943dd797d5f060e7ccef8fdc172cb830c9c'\nCHECK\n"
    - name: Install locked JavaScript tools only; image runtime remains immutable
      run: 'npm ci --omit=dev --ignore-scripts

        npm ci --ignore-scripts --prefix "tools/browser-compatibility/$TOOLCHAIN"

        mkdir -p .compatibility/results

        CI_BROWSER_DIAGNOSTICS="$PWD/.compatibility/results" GITHUB_SHA="$SOURCE_SHA" python scripts/prepare_browser_candidate.py browser-candidate browser-candidate-web

        '
    - name: Pull pinned official runtime and preserve registry identity
      run: 'docker pull --platform=linux/amd64 "$RUNTIME_IMAGE"

        docker image inspect "$RUNTIME_IMAGE" > .compatibility/image-inspect.json

        python - <<''CHECK''

        import json,os

        from pathlib import Path

        images=json.loads(Path(''.compatibility/image-inspect.json'').read_text())

        assert len(images)==1 and images[0][''Architecture'']==''amd64'' and images[0][''Os'']==''linux''

        assert os.environ[''RUNTIME_IMAGE''] in images[0][''RepoDigests'']

        CHECK

        '
    - name: Run unchanged five tests four times inside exact official runtime
      run: "python - <<'RUN'\nimport os,subprocess,uuid,json\nfrom pathlib import Path\nimage=json.loads(Path('.compatibility/image-inspect.json').read_text())[0]['Id']\nassert image.startswith('sha256:') and len(image)==71\nname='foss-runtime-'+uuid.uuid4().hex\ncommand=['docker','create','--name',name,'--label','foss.runtime-owner='+name,'--platform=linux/amd64','--network=none',\n '--cap-drop=ALL','--security-opt=no-new-privileges','--user',f'{os.getuid()}:{os.getgid()}',\n '--shm-size=1g','--memory=5g','--pids-limit=512','--ulimit','core=0',\n '-v',f'{Path.cwd()}:/work','-w','/work','-e','HOME=/tmp/foss-home',\n '-e','PLAYWRIGHT_BROWSERS_PATH=/ms-playwright','-e','CI=1']\n# No CI credentials or inherited environment are passed to the tested image.\nfor key in ['SOURCE_SHA','FIXTURE_SHA','RUNTIME_IMAGE','RUNTIME_GENERATION','TOOLCHAIN','PLAYWRIGHT_VERSION','BROWSER_VERSION','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT']:\n command+=['-e',key+'='+os.environ[key]]\ncommand += [image,'python3','scripts/foss-runtime-generation.py']\n\
        cid=subprocess.check_output(command,text=True).strip()\nassert len(cid)==64 and all(c in '0123456789abcdef' for c in cid)\nresult=None\ntry:\n result=subprocess.run(['docker','start','-a',cid],check=False,timeout=42*60)\nfinally:\n info=json.loads(subprocess.check_output(['docker','inspect',cid],text=True))[0]\n assert info['Id']==cid and info['Config']['Labels']['foss.runtime-owner']==name\n Path('.compatibility/container-result.json').write_text(json.dumps(info,indent=2))\n subprocess.run(['docker','rm','-f',cid],check=True)\nassert not info['State']['OOMKilled'], 'Runtime container exhausted memory'\nassert result is not None\nraise SystemExit(result.returncode)\nRUN\n"
    - name: Verify product and scenario sources remained unchanged
      if: ${{ always() }}
      run: git diff --exit-code
    - name: Preserve evidence, including failures
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: foss-runtime-${{ matrix.generation }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .compatibility/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
