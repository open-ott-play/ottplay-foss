name: Native Shells

on:
  workflow_call: {}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-guide:
    name: Shared guide / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Exercise shared guide through the actual native engine
        run: cargo test --locked -p ottplay-core -p ottplay-server

  android:
    name: Android native plugins
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          # The action installs command-line tools; its legacy "tools" default is unavailable.
          packages: platform-tools
      - name: Install Android API stubs for legacy JVM tests
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-36" </dev/null
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
      - run: npm ci --ignore-scripts
      - name: Verify Android TV WebView test host
        run: node tests/test_android_tv_webview.cjs
      - name: Verify archived Android bridge contracts without building an application
        run: |
          python3 tests/test_command_queue_smoke.py
          node tests/test_android_activity.cjs
          node tests/android_provider_policy.cjs
          node tests/test_play_system_icons.cjs
          node tests/test_native_runtime.cjs
          node tests/test_native_runtime_gate.cjs
          node tests/test_native_dev.cjs
          node tests/test_frontend_safety.cjs
          node tests/test_android_privacy_viewer.cjs
          python3 tests/test_android_emoji_policy.py
      - name: Exercise native queue JSON and socket cleanup
        run: |
          curl --fail --location --retry 3 https://github.com/JetBrains/kotlin/releases/download/v2.4.20/kotlin-compiler-2.4.20.zip -o "$RUNNER_TEMP/kotlin.zip"
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP/ott-queue-kotlin"
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/com/vaadin/external/google/android-json/0.0.20131108.vaadin1/android-json-0.0.20131108.vaadin1.jar -o "$RUNNER_TEMP/android-json.jar"
          export PATH="$RUNNER_TEMP/ott-queue-kotlin/kotlinc/bin:$PATH"
          export ANDROID_JSON_JAR="$RUNNER_TEMP/android-json.jar"
          python3 tests/test_android_queue.py
          python3 tests/test_android_epg_editions.py
          python3 tests/test_android_network_policy.py
          npm run test:native-dash
          python3 tests/test_native_media_lifecycle.py --platform android
          python3 tests/test_native_epg_cache.py --platform android
          python3 tests/test_native_xmltv_records.py --platform android

  apple:
    name: iOS and Tauri native code
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: npm ci --ignore-scripts
      - name: Verify optional authenticated HTTP smoke contract
        run: python3 tests/test_command_queue_smoke.py
      - run: npm run build:ios
      - name: Test demo playback lifecycle and XMLTV warmup
        run: |
          python3 tests/test_ios_demo_media.py
          python3 tests/test_native_media_lifecycle.py --platform ios
          python3 tests/test_native_epg_cache.py --platform ios
          python3 tests/test_native_xmltv_records.py --platform ios
          python3 tests/test_ios_proxy.py
          python3 tests/test_xmltv_warmup_smoke.py
      - name: Test iOS command queue consent and authentication
        run: python3 tests/test_ios_command_queue.py
      - name: Compile iOS plugins without signing
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/ottplay-ios"
          CODE_SIGNING_ALLOWED=NO build
      - name: Verify iOS application contains the audited runtime
        run: >-
          node scripts/native-runtime.cjs audit
          "$RUNNER_TEMP/ottplay-ios/Build/Products/Debug-iphonesimulator/App.app/public"
          --platform capacitor --source ios/App/App/public
      - name: Test compiled Tauri HTTP bridge
        run: cargo test --locked -p ottplay-tauri
