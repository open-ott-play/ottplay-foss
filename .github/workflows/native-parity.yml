# Temporary direct-MSE backend diagnostic only. Never merge this workflow replacement.
name: Native Shells
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
env:
  SOURCE_SHA: 1ecbc0e715b7481beba0caa859c14ea9ab304cc6
  CI: '1'
defaults:
  run:
    shell: bash
jobs:
  mse-init:
    name: Direct MSE backend / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - fixture: normalized
          fixture_sha: 4dd92888d29da4db04f5ebc8ed9faf42f73a1b33
          os: macos-15
          playwright: 1.63.0
          browser: '26.6'
          target: macos-15-webkit-1-63-0
          toolchain: playwright-1-63-0
    env:
      FIXTURE: ${{ matrix.fixture }}
      FIXTURE_SHA: ${{ matrix.fixture_sha }}
      TOOLCHAIN: ${{ matrix.toolchain }}
      PLAYWRIGHT_VERSION: ${{ matrix.playwright }}
      BROWSER_VERSION: ${{ matrix.browser }}
      CI_BROWSER_TARGET_ID: ${{ matrix.target }}
      CI_BROWSER_ENGINE: webkit
      CI_BROWSER_CHANNEL: ''
    steps:
    - name: Audit outbound calls
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Bind source and unchanged original assertions
      run: "test \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\nfor file in tests/browser/plex-provider.spec.cjs scripts/browser-acceptance.cjs scripts/browser-compatibility-profile.cjs playwright.compatibility.config.cjs scripts/prepare_browser_candidate.py package-lock.json package.json playwright.config.cjs .github/browser-compatibility.json \"tools/browser-compatibility/$TOOLCHAIN/package.json\" \"tools/browser-compatibility/$TOOLCHAIN/package-lock.json\" tests/helpers/device-browser-server.cjs tests/helpers/hls-aspect-fixture.cjs tests/helpers/browser-test.cjs; do\n  test \"$(git rev-parse \"$FIXTURE_SHA:$file\")\" = \"$(git rev-parse \"HEAD:$file\")\"\ndone\npython - <<'CHECK'\nimport os,subprocess\nchanged=subprocess.check_output(['git','diff','--name-only',os.environ['FIXTURE_SHA'],'HEAD'],text=True).splitlines()\nassert set(changed)=={'.github/workflows/native-parity.yml','.github/diagnostics/mse-init-probe.cjs'}\nCHECK\n"
    - name: Download exact failed RC artifact for diagnosis only
      env:
        GH_TOKEN: ${{ github.token }}
      run: "mkdir -p browser-candidate .compatibility\n# The raw ZIP digest is checked before any extraction.\ngh api repos/open-ott-play/ottplay-foss/actions/artifacts/12028984213 > .compatibility/artifact.json\ngh api repos/open-ott-play/ottplay-foss/actions/artifacts/12028984213/zip > .compatibility/candidate.zip\npython - <<'CHECK'\nimport hashlib,json,zipfile\nfrom pathlib import Path,PurePosixPath\nm=json.loads(Path('.compatibility/artifact.json').read_text())\nassert m['id']==12028984213 and m['name']=='release-assets-web' and not m['expired']\nassert m['workflow_run']['id']==38859121986 and m['workflow_run']['head_sha']=='1ecbc0e715b7481beba0caa859c14ea9ab304cc6'\nexpected='72367af238d5bcebc1d768c80ec47e2751e56f893c512c11c7dc16807dc82528'\nassert m['digest']=='sha256:'+expected\nzip_path=Path('.compatibility/candidate.zip')\nassert zip_path.stat().st_size <= 50*1024*1024\nassert hashlib.sha256(zip_path.read_bytes()).hexdigest()==expected\nwith zipfile.ZipFile(zip_path) as z:\n entries=z.infolist();\
        \ assert len(entries)<=100\n assert sum(i.file_size for i in entries)<=100*1024*1024\n names=set()\n for i in entries:\n  p=PurePosixPath(i.filename)\n  assert len(p.parts)==1 and p.name==i.filename and p.name not in ('.','..') and '\\\\' not in i.filename\n  assert p.name not in names; names.add(p.name)\n  assert (i.external_attr>>16)&0o170000 in (0,0o100000)\n  assert i.file_size<=50*1024*1024\n  Path('browser-candidate',p.name).write_bytes(z.read(i))\narchive=Path('browser-candidate/ottplay-foss-modea.tar.gz')\nassert hashlib.sha256(archive.read_bytes()).hexdigest()=='0ea6bc631c30d9b3d50ccec3d6593cc951ea7d03e812da283cc6afe67fa0165a'\nCHECK\n"
    - name: Install locked dependencies and exact browser generation
      run: 'npm ci --omit=dev --ignore-scripts

        npm ci --ignore-scripts --prefix "tools/browser-compatibility/$TOOLCHAIN"

        node "tools/browser-compatibility/$TOOLCHAIN/node_modules/playwright/cli.js" install --with-deps webkit

        '
    - name: Set diagnostic paths
      run: "node <<'NODE'\nconst fs=require('node:fs'),path=require('node:path');\nconst output=path.resolve('.compatibility/results');fs.mkdirSync(output,{recursive:true});\nfs.appendFileSync(process.env.GITHUB_ENV,[\n 'CI_PLAYWRIGHT_MODULE='+path.resolve('tools/browser-compatibility/'+process.env.TOOLCHAIN+'/node_modules/playwright'),\n 'CI_BROWSER_DIAGNOSTICS='+output,'CI_BROWSER_EVIDENCE='+path.join(output,'result.json')].join('\\n')+'\\n');\nNODE\n"
    - name: Verify actual immutable packaged runtime without rebuilding
      run: GITHUB_SHA="$SOURCE_SHA" python scripts/prepare_browser_candidate.py browser-candidate browser-candidate-web --release
    - name: Bind actual browser and diagnostic identity
      run: "node <<'NODE'\nconst fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict');\n(async()=>{\n const modulePath=process.env.CI_PLAYWRIGHT_MODULE;\n const version=require(path.join(modulePath,'package.json')).version;\n assert.equal(version,process.env.PLAYWRIGHT_VERSION);\n assert.equal(require(path.join(modulePath,'../playwright-core/package.json')).version,version);\n assert.equal(process.platform,process.env.CI_BROWSER_TARGET_ID.startsWith('macos-')?'darwin':'linux');\n const browser=await require(modulePath).webkit.launch({headless:true});\n try {\n  assert.equal(browser.version(),process.env.BROWSER_VERSION);\n  fs.writeFileSync(path.join(process.env.CI_BROWSER_DIAGNOSTICS,'runtime.json'),JSON.stringify({\n   schema:1,diagnosticOnly:true,scope:'direct-mse-backend',instrumentationSha256:require('node:crypto').createHash('sha256').update(fs.readFileSync('.github/diagnostics/mse-init-probe.cjs')).digest('hex'),fixture:process.env.FIXTURE,fixtureSourceSha:process.env.FIXTURE_SHA,\n\
        \   target:process.env.CI_BROWSER_TARGET_ID,engine:'webkit',channel:'',playwrightVersion:version,\n   browserVersion:browser.version(),platform:process.platform,arch:process.arch,osRelease:require('node:os').release(),osVersion:require('node:os').version(),browserBuilds:JSON.parse(fs.readFileSync(path.join(modulePath,'../playwright-core/browsers.json'),'utf8')),sourceSha:process.env.SOURCE_SHA,\n   workflowSha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,\n   releaseChannel:'',candidateArtifactId:'12028984213',candidateRunId:'38859121986',\n  },null,2));\n } finally {await browser.close();}\n})().catch(e=>{console.error(e);process.exitCode=1});\nNODE\nif command -v dpkg-query >/dev/null; then dpkg-query -W '*gstreamer*' > .compatibility/gstreamer-versions.txt; fi\nmkdir -p .compatibility/instrumentation\ncp .github/diagnostics/mse-init-probe.cjs .compatibility/instrumentation/\n"
    - name: Observe exact init and combined appends; no application verdict
      env:
        DEBUG: pw:browser
        GST_DEBUG: '2'
      run: 'node .github/diagnostics/mse-init-probe.cjs

        git diff --exit-code

        '
    - name: Preserve diagnostic evidence, including failures
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: foss-mse-backend-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .compatibility/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
