name: CI

on:
  workflow_call: {}

env:
  NODE_VERSION: '22'

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: TypeScript check
        run: npm run typecheck

    timeout-minutes: 30
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Biome lint
        run: npm run lint

    timeout-minutes: 30
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build container frontend from declared inputs
        timeout-minutes: 10
        run: docker build --target build --progress=plain .

      - name: Build bundle
        run: npm run build

      - name: Check classic bundle size budgets
        run: npm run check:size

      - name: Measure emitted classic module composition
        run: npm run measure:composition

      - name: Upload classic build report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: classic-build-report-${{ github.sha }}
          path: |
            build/reports/classic-bundle.json
            build/reports/classic-composition.json
          if-no-files-found: error
          retention-days: 14

      - name: Classic bundle smoke (ES5)
        run: npm run check:bundle

      - name: Check emitted ES5 grammar
        run: npm run check:es5

      - name: Install browsers for device and native UI checks
        run: npx playwright install --with-deps chromium webkit

      - name: Test device boot and remote navigation in Chromium
        run: npm run test:devices:browser

      - name: Test native channel formatting with enforced CSP
        run: npm run test:native:ui

      - name: Upload device browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: device-browser-failures-${{ github.sha }}
          path: |
            build/device-browser-report/
            build/device-browser-results/
            build/native-ui-report/
            build/native-ui-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Package base OTT for device testing
        run: npm run package:modea

      - name: Upload base OTT test bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ottplay-foss-modea-${{ github.sha }}
          path: |
            build/packages/ottplay-foss-modea.tar.gz
            build/packages/ottplay-foss-modea.sha256
          retention-days: 14


    timeout-minutes: 30
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:test-inventory
      - run: npm test
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install --only-binary=:all: -r requirements-test.txt
      - name: Python suite and runtime branch coverage gate
        run: npm run test:python
      - name: Preserve Python suite evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-suite-evidence
          path: reports/python/
          retention-days: 14

    timeout-minutes: 30
  rust-tests:
    name: Rust Core and Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Test isolated container workspace and lockfile inputs
        run: python3 tests/test_container_workspace.py
      - name: Test core and server without desktop system dependencies
        run: cargo test --locked -p ottplay-core -p ottplay-server
      - name: Verify published GLib source and security backport
        run: node scripts/check-glib-backport.cjs
      - name: Install GLib for optimized iterator regression
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev pkg-config
      - name: Exercise patched GLib iterator through FFI in release mode
        run: cargo test --locked --release --manifest-path tests/glib-variant-regression/Cargo.toml
    timeout-minutes: 30
