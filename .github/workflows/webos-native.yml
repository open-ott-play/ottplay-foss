name: Native webOS candidate

on:
  workflow_dispatch:
    inputs:
      build_bench:
        description: "Only measure the pinned native before/after pair (ordinary CI is separate)"
        type: boolean
        default: false
      bench_head_tree:
        description: "Reviewed full prepared Native tree for this exact dispatch commit"
        type: string
        default: ""
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: webos-native-${{ github.event_name == 'workflow_dispatch' && inputs.build_bench && 'bench-' || '' }}${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_bench) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Classify native build inputs
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/webos-native-scope.py
      - run: python3 -m unittest discover -s native/webos -p 'test_*.py' -v
      - run: python3 -m unittest discover -s native/webos/companion -p 'test_*.py' -v
      - run: python3 -m unittest discover -s tests -p test_webos_runtime_sources.py -v
      - run: python3 -m unittest discover -s tests -p test_webos_native_release.py -v

  native-candidate:
    needs: contracts
    if: ${{ needs.contracts.outputs.build == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      JOBS: "2"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install native build prerequisites
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build meson pkg-config autoconf automake libtool bzip2 libclang-18-dev libsdl2-dev libsdl2-ttf-dev libgl1-mesa-dev libgl1-mesa-dri libwayland-dev libglib2.0-dev xvfb xauth openssl curl libcurl4t64
          # PyPI CPython 3.12 manylinux aarch64 wheel; required by the package pixel checks.
          python3 -m pip install --force-reinstall --require-hashes --only-binary=:all: -r /dev/stdin <<'REQUIREMENTS'
          Pillow==13.0.0 --hash=sha256:8bf295fe459343bc6093c8e5e0df60bfa189e0fcb775a22e2c2488fdeccc6c0d
          REQUIREMENTS
      - name: Prepare native source and verified SDK
        run: |
          if [ -e build/native-webos ] || [ -L build/native-webos ]; then
            echo 'Native build requires a fresh work directory and vendor inputs.' >&2
            exit 1
          fi
          python3 native/webos/build.py prepare
          python3 native/webos/build.py bootstrap
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          spec = json.loads(Path("native/webos/upstream.json").read_text())
          work = Path("build/native-webos").resolve()
          expected = spec["sdk"]["assets"]["linux-aarch64"]["sha256"]
          matches = []
          for path in (work / "downloads").rglob("*.tar.bz2"):
              with path.open("rb") as stream:
                  if hashlib.file_digest(stream, "sha256").hexdigest() == expected:
                      matches.append(path)
          if len(matches) != 1:
              raise SystemExit("Expected exactly one original, verified SDK archive")
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write(f"WEBOS_SDK={work / 'toolchain' / spec['sdk']['directory']}\n")
              stream.write(f"WEBOS_SDK_ARCHIVE={matches[0]}\n")
          PY
      - name: Verify host transport and package pixel prerequisites
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import ctypes
          import ssl
          import subprocess
          import tempfile
          from pathlib import Path
          import PIL
          from PIL import Image

          # Read the same shared library the default transport tests dlopen.
          class CurlVersion(ctypes.Structure):
              _fields_ = [("age", ctypes.c_int), ("version", ctypes.c_char_p),
                          ("version_num", ctypes.c_uint), ("host", ctypes.c_char_p),
                          ("features", ctypes.c_int)]

          curl = ctypes.CDLL("libcurl.so.4")
          curl.curl_version_info.argtypes = [ctypes.c_int]
          curl.curl_version_info.restype = ctypes.POINTER(CurlVersion)
          info = curl.curl_version_info(0)  # Read only fields from CURLVERSION_FIRST.
          required = (1 << 2) | (1 << 16)  # CURL_VERSION_SSL | CURL_VERSION_HTTP2
          if not info or info.contents.features & required != required:
              raise RuntimeError("Host libcurl must support TLS and HTTP/2")
          if not ssl.HAS_ALPN:
              raise RuntimeError("Host Python TLS must support ALPN")
          with tempfile.TemporaryDirectory(prefix="native-host-tls-") as temporary:
              cert, key = (Path(temporary) / name for name in ("cert.pem", "key.pem"))
              subprocess.run(["openssl", "req", "-x509", "-newkey", "rsa:2048", "-nodes",
                              "-days", "1", "-subj", "/CN=synthetic-loopback",
                              "-keyout", str(key), "-out", str(cert)],
                             check=True, timeout=15, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
              context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
              context.minimum_version = ssl.TLSVersion.TLSv1_2
              context.load_cert_chain(cert, key)
              context.set_alpn_protocols(["h2"])
          if PIL.__version__ != "13.0.0":
              raise RuntimeError("Package pixel checks require the pinned Pillow")
          with Image.open("build/native-webos/source/pkg/largeIcon.png") as icon:
              icon.convert("RGB").getpixel((1, 1))
          print("Host prerequisites:", info.contents.version.decode(), ssl.OPENSSL_VERSION,
                "HTTP/2 + ALPN; Pillow", PIL.__version__)
          PY
      # Host builds can stage libass and change native Make configuration. Run them
      # before companion/native packaging; never mutate an already-built ARM candidate.
      - name: Install pinned native host verification components
        timeout-minutes: 5
        working-directory: build/native-webos/source
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          PLX_CARGO_SEED: "off"
          HOST_THREADS: "0"
          RELEASE: ""
          PLX_TEST_JOBS: "2"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-host-verification"
          cp ../prepared.json "$RUNNER_TEMP/native-host-verification/prepared-before.json"
          toolchain=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("rust-modules/rust-toolchain.toml").read_text())["toolchain"]["channel"])')
          printf '%s\n' "$toolchain" > "$RUNNER_TEMP/native-host-verification/rust-toolchain.txt"
          rustup component add --toolchain "$toolchain" clippy rustfmt 2>&1 | tee "$RUNNER_TEMP/native-host-verification/components.log"
      - name: Native full check, package contracts and shipping type checks
        # Replaces the 10 + 25 + 25 minute partial host gates without repeating them.
        # The unchanged 90-minute job limit still bounds host, replay and ARM work.
        timeout-minutes: 60
        working-directory: build/native-webos/source
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          PLX_CARGO_SEED: "off"
          HOST_THREADS: "0"
          RELEASE: ""
          PLX_TEST_JOBS: "2"
        run: |
          set -euo pipefail
          python3 ci/check-package.py --selftest 2>&1 | tee "$RUNNER_TEMP/native-host-verification/package-selftest.log"
          python3 ci/test_package_product_config.py 2>&1 | tee "$RUNNER_TEMP/native-host-verification/product-config-tests.log"
          # Run both canonical branches: all Cargo gates and Python/C/harness checks.
          make check 2>&1 | tee "$RUNNER_TEMP/native-host-verification/check.log"
          make check-nodef 2>&1 | tee "$RUNNER_TEMP/native-host-verification/nodef.log"
      - name: Build the native Linux renderer
        timeout-minutes: 30
        working-directory: build/native-webos/source
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          PLX_CARGO_SEED: "off"
          HOST_THREADS: "0"
          RELEASE: ""
          PLX_TEST_JOBS: "2"
        run: |
          set -euo pipefail
          make sim-linux SIM_TDIR=rust-modules/target-sim-ci 2>&1 | tee "$RUNNER_TEMP/native-host-verification/simulator-build.log"
      - name: Replay committed product recordings through the Linux renderer
        # Six current recordings/modes at up to 300 seconds each, with shutdown margin.
        # The unchanged 90-minute job limit still bounds the complete cold build.
        timeout-minutes: 31
        working-directory: build/native-webos/source
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          PLX_CARGO_SEED: "off"
          HOST_THREADS: "0"
          RELEASE: ""
          PLX_TEST_JOBS: "2"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' python3 tests/replay_fixtures.py \
            --sim "$PWD/rust-modules/target-sim-ci/release/plxnative-sim" \
            --assets "$PWD/pkg" --window 960x540 --jobs 1 --timeout 300 \
            --output "$RUNNER_TEMP/native-host-verification/replay" \
            2>&1 | tee "$RUNNER_TEMP/native-host-verification/replay.log"
      - name: Recheck the prepared native source after host verification
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          # An existing preparation is validated in place, not reset or cloned again.
          python3 native/webos/build.py prepare 2>&1 | tee "$RUNNER_TEMP/native-host-verification/source-recheck.log"
          cp build/native-webos/prepared.json "$RUNNER_TEMP/native-host-verification/prepared-after.json"
      - name: Prepare pinned companion inputs
        run: |
          python3 native/webos/companion/prepare.py \
            --cache-dir "$RUNNER_TEMP/companion-cache" \
            --target-dir "$RUNNER_TEMP/companion-target" \
            --output "$RUNNER_TEMP/companion-prepared.json"
      - name: Build companion and collect its locked source closure
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          temporary = Path(os.environ["RUNNER_TEMP"])
          prepared = json.loads((temporary / "companion-prepared.json").read_text())
          # Native optimization must not change the independently pinned companion.
          environment = dict(os.environ)
          for name in list(environment):
              if name.startswith("CARGO_PROFILE_"):
                  del environment[name]
          for name in (
              "RUSTC", "RUSTC_WRAPPER", "RUSTC_WORKSPACE_WRAPPER", "RUSTFLAGS",
              "CARGO_ENCODED_RUSTFLAGS", "CARGO_BUILD_RUSTC_WRAPPER",
              "CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER",
          ):
              environment.pop(name, None)
          environment.update(prepared["environment"])
          environment["RUSTUP_AUTO_INSTALL"] = "0"
          if any(name.startswith("CARGO_PROFILE_") for name in environment):
              raise ValueError("Native profile override in companion preparation")
          if (environment.get("RUSTUP_TOOLCHAIN") != "1.96.1"
                  or environment.get("CARGO_INCREMENTAL") != "0"
                  or environment.get("CARGO_NET_OFFLINE") != "true"):
              raise ValueError("Unexpected companion preparation contract")
          bundle = temporary / "companion-bundle"
          subprocess.run([
              sys.executable, "native/webos/companion/build.py", "build",
              "--sdk", os.environ["WEBOS_SDK"],
              "--sdk-archive", os.environ["WEBOS_SDK_ARCHIVE"],
              "--target-dir", prepared["target_dir"], "--libclang", prepared["libclang"],
              "--jobs", "2", "--output", str(bundle),
          ], env=environment, check=True)
          subprocess.run([
              sys.executable, "native/webos/companion/sources.py",
              "--bundle", str(bundle), "--output", str(temporary / "companion-source"),
              "--readelf", os.environ["WEBOS_SDK"] + "/bin/arm-webos-linux-gnueabi-readelf",
              "--rust-sysroot", prepared["rust_sysroot"],
              "--rust-source-archive", prepared["rust_source_archive"],
          ], env=environment, check=True)
          PY
      - name: Build and verify native binary with corresponding source
        env:
          NATIVE_CONTROL_DISCOVERY_URL: https://player.ottplay.here.now/local/control-discovery.0a3bf94cadba71fdd02af4783574ea4690de2839a3eaa05a2bea18a715eb2e4d.json
          NATIVE_CONTROL_DISCOVERY_SHA256: 0a3bf94cadba71fdd02af4783574ea4690de2839a3eaa05a2bea18a715eb2e4d
        run: |
          python3 native/webos/build.py all --jobs 2 --rust-opt-level s \
            --control-discovery-url "$NATIVE_CONTROL_DISCOVERY_URL" \
            --control-discovery-sha256 "$NATIVE_CONTROL_DISCOVERY_SHA256" \
            --companion-bundle "$RUNNER_TEMP/companion-bundle"
      - name: Bind runtime sources and final linker evidence
        run: |
          native_version=$(python3 -c 'import json; print(json.load(open("native/webos/upstream.json"))["application"]["version"])')
          python3 scripts/webos-runtime-sources.py \
            --metadata "build/native-webos/dist/ottplay-native-webos-${native_version}.json" \
            --source build/native-webos/source \
            --sdk "$WEBOS_SDK" --sdk-archive "$WEBOS_SDK_ARCHIVE" \
            --companion-bundle "$RUNNER_TEMP/companion-bundle" \
            --companion-sources "$RUNNER_TEMP/companion-source"
      - name: Verify the complete distributable bundle
        id: bundle
        run: |
          native_version=$(python3 -c 'import json; print(json.load(open("native/webos/upstream.json"))["application"]["version"])')
          python3 scripts/verify-webos-native-release.py \
            --metadata "build/native-webos/dist/ottplay-native-webos-${native_version}.json" \
            --check-checkout
          printf 'version=%s\n' "$native_version" >> "$GITHUB_OUTPUT"
      - name: Preserve the binary and matching source as one candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ottplay-native-webos-candidate
          path: |
            build/native-webos/dist/ottplay-native-webos-${{ steps.bundle.outputs.version }}.ipk
            build/native-webos/dist/ottplay-native-webos-${{ steps.bundle.outputs.version }}.json
            build/native-webos/dist/ottplay-native-webos-${{ steps.bundle.outputs.version }}.sha256
            build/native-webos/dist/ottplay-native-webos-${{ steps.bundle.outputs.version }}-source.tar.gz
            build/native-webos/dist/ottplay-native-webos-${{ steps.bundle.outputs.version }}-source.tar.gz.release.json
            build/native-webos/dist/ottplay-native-webos-${{ steps.bundle.outputs.version }}-runtime-source.tar.gz
            build/native-webos/dist/ottplay-native-webos-${{ steps.bundle.outputs.version }}-source-set.json
            build/native-webos/dist/ottplay-native-webos-icon.png
            build/native-webos/dist/ottplay-native-webos-${{ steps.bundle.outputs.version }}-cargo-artifacts.jsonl
            build/native-webos/dist/ottplay-native-webos-${{ steps.bundle.outputs.version }}-build-config.txt
          if-no-files-found: error
          retention-days: 30
      - name: Preserve native host verification evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ottplay-native-host-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-host-verification/*.log
            ${{ runner.temp }}/native-host-verification/*.json
            ${{ runner.temp }}/native-host-verification/rust-toolchain.txt
            ${{ runner.temp }}/native-host-verification/replay/**/plxnative-events.log
            ${{ runner.temp }}/native-host-verification/replay/**/sim.out
          if-no-files-found: warn
          retention-days: 30

  native-build-bench:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_bench }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      JOBS: "2"
      CARGO_BUILD_JOBS: "2"
      BENCH_HEAD_TREE: ${{ inputs.bench_head_tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the reviewed after-tree pin
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BENCH_HEAD_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" != 39dd8b4581a3375558fd6e15827c5cb17bf4c4f8
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "39dd8b4581a3375558fd6e15827c5cb17bf4c4f8"
          path: benchmark-before
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install native build prerequisites
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build meson pkg-config autoconf automake libtool bzip2 libclang-18-dev libsdl2-dev libsdl2-ttf-dev libgl1-mesa-dev libgl1-mesa-dri libwayland-dev libglib2.0-dev xvfb xauth openssl curl libcurl4t64
          # PyPI CPython 3.12 manylinux aarch64 wheel; required by the package pixel checks.
          python3 -m pip install --force-reinstall --require-hashes --only-binary=:all: -r /dev/stdin <<'REQUIREMENTS'
          Pillow==13.0.0 --hash=sha256:8bf295fe459343bc6093c8e5e0df60bfa189e0fcb775a22e2c2488fdeccc6c0d
          REQUIREMENTS
      - name: Measure both native source closures sequentially on this runner
        timeout-minutes: 160
        shell: bash
        run: |
          python3 - <<'PYBENCH'
          import hashlib
          import importlib.util
          import json
          import math
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          from types import SimpleNamespace

          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          evidence = Path(os.environ['RUNNER_TEMP']) / 'native-build-bench-evidence'
          work = Path(os.environ['RUNNER_TEMP']) / 'native-build-bench-work'
          evidence.mkdir(exist_ok=True)
          work.mkdir(exist_ok=True)
          base = '39dd8b4581a3375558fd6e15827c5cb17bf4c4f8'
          head = os.environ['GITHUB_SHA']
          head_tree = os.environ['BENCH_HEAD_TREE']
          for value in (head, head_tree):
              if not re.fullmatch('[0-9a-f]{40}', value):
                  raise ValueError('The dispatch commit and reviewed prepared tree must be full object IDs')
          if head == base:
              raise ValueError('Before and after must be different outer commits')

          # Every changed crate plus the shared base leaf and UI hub. No invented benchmark.
          rows = 'noop,leaf,platform,ui,plex,data,session,media,appkit,screens,app,hub,sizes'
          phases = [('before', workspace / 'benchmark-before', base,
                     '5c2d31b2adf3386b84f99dd0d91f9be8a9dbaae0'),
                    ('after', workspace, head, head_tree)]

          def git(root, *args, **kwargs):
              return subprocess.check_output(['git', '-C', str(root), *args], text=True, **kwargs).strip()

          def digest(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()

          # Native22 already removed three build scripts. Correct only its stale test
          # inventory, identically to AFTER, and keep the original producer receipt.
          fixture_path = 'tests/test_harness.py'
          fixture_before_sha256 = '86c9a25120ed07a0295246e2aac3ccbaf8f9d326373cf0b872821d58b9a2552f'
          fixture_after_sha256 = '67ae17211c41b6cdb8a57ae5f2e32f7f59115d15983656c400eeeb3bc2589067'
          baseline_measured_tree = 'ec4696bc1a0bc8ac750fcd03a07b686d383410f5'
          fixture_patch = workspace / 'native/webos/benchmarks/fpflags-fixture.patch'
          fixture_patch_sha256 = '5fcdf6f5a1327f6776a4ad83c8e4ae7b190a3e884ce31bdc2cf8eb11e8b5741d'
          if (fixture_patch.resolve() != fixture_patch.absolute()
                  or not fixture_patch.is_file()
                  or digest(fixture_patch) != fixture_patch_sha256):
              raise ValueError('Benchmark fixture correction differs from the reviewed patch')

          def checked_document(path, expected, count):
              doc = json.loads(path.read_text())
              actual = [row['id'] for row in doc['scenarios']]
              if len(actual) != len(set(actual)) or set(actual) != set(expected):
                  raise ValueError('Missing, extra or duplicate benchmark scenario')
              if doc['failure'] or doc['red'] or not doc['restored_clean'] or not doc['via_make']:
                  raise ValueError('Incomplete or unsuccessful benchmark')
              if doc['runs'] != count:
                  raise ValueError('Unexpected sample count')
              # Prove the edited crate rebuilt; downstream dependency reuse is allowed.
              rebuild_flags = {
                  'leaf': 'base_rebuilt', 'platform': 'platform_rebuilt',
                  'ui': 'ui_rebuilt', 'plex': 'plex_rebuilt', 'data': 'data_rebuilt',
                  'session': 'session_rebuilt', 'media': 'media_rebuilt',
                  'appkit': 'appkit_rebuilt', 'screens': 'screens_rebuilt',
                  'app': 'app_rebuilt', 'hub': 'ui_rebuilt',
              }
              for row in doc['scenarios']:
                  if row['status'] != 'ok':
                      raise ValueError('Skipped or failed required benchmark row')
                  samples = row['samples']
                  if row['id'] == 'sizes':
                      continue
                  if len(samples) != count or any(not math.isfinite(s['seconds']) or s['seconds'] < 0 for s in samples):
                      raise ValueError('Missing or invalid timed sample')
                  if row['id'] == 'noop' and any(s['app_rebuilt'] for s in samples):
                      raise ValueError('Unexpected no-op rebuild must be investigated')
                  rebuild_flag = rebuild_flags.get(row['id'])
                  if rebuild_flag and not all(s.get(rebuild_flag) is True for s in samples):
                      raise ValueError('Edited-crate benchmark did not rebuild ' + rebuild_flag)
              return doc

          bindings = []
          benchmark_hash = None
          sdk_contract = None
          for label, outer, outer_sha, expected_tree in phases:
              if git(outer, 'rev-parse', 'HEAD') != outer_sha:
                  raise ValueError('Outer checkout differs from requested commit')
              mod_path = outer / 'native/webos/build.py'
              spec = importlib.util.spec_from_file_location('native_bench_'+label, mod_path)
              builder = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(builder)
              manifest = builder.manifest()
              if sdk_contract is not None and manifest['sdk'] != sdk_contract:
                  raise ValueError('SDK changes need a separately reviewed comparison')
              sdk_contract = manifest['sdk']
              phase_work = work / label
              sdk = work / 'toolchain' / manifest['sdk']['directory']
              args = SimpleNamespace(work_dir=phase_work, local_upstream=None, sdk=sdk,
                                     rust_opt_level='2', control_discovery_url=None,
                                     control_discovery_sha256=None)
              builder.prepare(args, manifest)
              source = builder.check_source(args, manifest)
              prepared_path = builder.source_receipt(args)
              prepared = json.loads(prepared_path.read_text())
              if prepared['tree'] != expected_tree:
                  raise ValueError('Prepared Native tree differs from reviewed closure')
              builder.bootstrap(args, manifest)
              subprocess.run([sys.executable, 'ci/deps.py', 'stage', 'nanosvg', '--into', 'vendor/nanosvg'],
                             cwd=source, check=True)
              subprocess.run(['rustup', 'component', 'add', '--toolchain', builder.toolchain(source),
                              'clippy', 'rustfmt'], check=True)
              tool_hash = digest(source / 'tools/build-bench.py')
              if benchmark_hash is not None and benchmark_hash != tool_hash:
                  raise ValueError('The benchmark implementation changed; comparison needs review')
              benchmark_hash = tool_hash
              (evidence / (label+'-prepared-before.json')).write_bytes(prepared_path.read_bytes())
              provenance = source / 'ci/ottplay-integration/PROVENANCE.json'
              (evidence / (label+'-provenance.json')).write_bytes(provenance.read_bytes())
              upstream = git(source, 'rev-parse', 'HEAD')
              if subprocess.run(['git','-C',str(source),'symbolic-ref','-q','HEAD'],
                                stdout=subprocess.DEVNULL).returncode != 1:
                  raise ValueError('Preparation must have detached HEAD')
              # build-bench needs a clean snapshot. BEFORE has one explicit test-only
              # overlay; its original prepared tree and receipt remain the restore target.
              identity = dict(os.environ, GIT_AUTHOR_NAME='Native build benchmark',
                              GIT_AUTHOR_EMAIL='benchmark@example.invalid',
                              GIT_COMMITTER_NAME='Native build benchmark',
                              GIT_COMMITTER_EMAIL='benchmark@example.invalid')
              prepared_sha256 = digest(prepared_path)
              binding = None
              fixture_changed = False
              snapshot_installed = False
              measured_tree = expected_tree
              try:
                  original_fixture_sha256 = digest(source / fixture_path)
                  if label == 'before':
                      if original_fixture_sha256 != fixture_before_sha256:
                          raise ValueError('Original baseline fixture differs from the reviewed input')
                      # Mark before applying so even a failed apply restores this one path.
                      fixture_changed = True
                      git(source, 'apply', '--index', str(fixture_patch))
                      measured_tree = git(source, 'write-tree')
                      if measured_tree != baseline_measured_tree:
                          raise ValueError('Corrected baseline differs from the reviewed tree')
                      if git(source, 'diff-tree', '--no-commit-id', '--name-only', '-r',
                             expected_tree, measured_tree) != fixture_path:
                          raise ValueError('Baseline correction changed more than the fixture')
                  if digest(source / fixture_path) != fixture_after_sha256:
                      raise ValueError('Before and after must carry the same corrected fixture')
                  bench_commit = git(source, 'commit-tree', measured_tree, '-p', upstream,
                                     '-m', 'Ephemeral benchmark snapshot for '+outer_sha, env=identity)
                  git(source, 'update-ref', '--no-deref', 'HEAD', bench_commit, upstream)
                  snapshot_installed = True
                  binding = dict(label=label, outer_commit=outer_sha, prepared=prepared,
                                 prepared_sha256=prepared_sha256, provenance_sha256=digest(provenance),
                                 benchmark_sha256=tool_hash, synthetic_benchmark_commit=bench_commit,
                                 original_prepared_tree=expected_tree, measured_tree=measured_tree,
                                 fixture_correction=dict(path=fixture_path, applied=fixture_changed,
                                     patch_sha256=fixture_patch_sha256,
                                     original_sha256=original_fixture_sha256,
                                     measured_sha256=fixture_after_sha256),
                                 makefile_sha256=digest(source/'Makefile'), builder_sha256=digest(mod_path),
                                 documents={})
                  (evidence / (label+'-binding-before.json')).write_text(json.dumps(binding, indent=2)+'\n')
                  # Reuse the producer's config-free Cargo home and real cache lock aliases.
                  # Do not use build_env's RELEASE=1/ARM profile for a host benchmark.
                  with builder.cargo_environment(args) as isolated:
                      environment = dict(os.environ, CARGO_HOME=isolated['CARGO_HOME'],
                                         CARGO_INCREMENTAL='0', PLX_CARGO_SEED='off',
                                         HOST_THREADS='0', RELEASE='', PLX_TEST_JOBS='2',
                                         JOBS='2', CARGO_BUILD_JOBS='2')
                      for suffix, selected, count in [('rows', rows, 3), ('check', 'check', 1)]:
                          output = evidence / (label+'-'+suffix+'.json')
                          log = evidence / (label+'-'+suffix+'.log')
                          with log.open('wb') as stream:
                              subprocess.run(['make', 'build-bench',
                                              f'ARGS=--runs {count} --only {selected} --json {output}'],
                                             cwd=source, env=environment, stdout=stream,
                                             stderr=subprocess.STDOUT, check=True)
                          doc = checked_document(output, selected.split(','), count)
                          if doc['git_sha'] != bench_commit[:12] or doc['tree_dirty']:
                              raise ValueError('Benchmark was not run against the clean pinned snapshot')
                          binding['documents'][suffix] = dict(sha256=digest(output), log_sha256=digest(log),
                                                              toolchain=doc['toolchain'], host=doc['host'],
                                                              runner=doc['runner'])
              finally:
                  # Restore the private overlay even if restoring HEAD itself fails.
                  # No public ref or original producer receipt is rewritten.
                  try:
                      if snapshot_installed:
                          git(source, 'update-ref', '--no-deref', 'HEAD', upstream, bench_commit)
                  finally:
                      if fixture_changed:
                          git(source, 'restore', '--source='+expected_tree, '--staged',
                              '--worktree', '--', fixture_path)
                  builder.check_source(args, manifest)
                  (evidence / (label+'-prepared-after.json')).write_bytes(prepared_path.read_bytes())
                  if digest(prepared_path) != prepared_sha256:
                      raise ValueError('Prepared receipt changed during measurement')
                  if binding is not None:
                      (evidence / (label+'-binding-after.json')).write_text(json.dumps(binding, indent=2)+'\n')
              bindings.append(binding)

          for suffix in ('rows', 'check'):
              left, right = (b['documents'][suffix] for b in bindings)
              if any(left[key] != right[key] for key in ('toolchain','host','runner')):
                  raise ValueError('Before/after were not measured on the same host/toolchain')
          (evidence / 'complete-pair.json').write_text(json.dumps(dict(
              status='COMPLETE_MEASURED_PAIR', bindings=bindings,
              omitted=['machine','gfx','net','telemetry','leaf-inc','hub-inc','tests','arm'],
              scope='Common-fixture host rebuilds and full make check; original and measured trees are separate; no ARM/runtime claim'), indent=2)+'\n')
          PYBENCH
      - name: Preserve raw before/after benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-build-bench-${{ github.sha }}
          path: ${{ runner.temp }}/native-build-bench-evidence/
          if-no-files-found: error
          retention-days: 30
