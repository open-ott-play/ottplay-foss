# Temporary replacement on diagnostic/client-color-cost-20261106 only.
# Never merge this workflow or its control branch into main/the feature PR.
name: Bounded client color cost comparison

on:
  workflow_dispatch:
    inputs:
      manifest_sha256:
        description: "Reviewed SHA256 of the finalized bound manifest (64 lowercase hex characters)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: client-color-cost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/client-color-cost-20261106' }}
    name: Measure pinned baseline and isolated color feature
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with:
          egress-policy: audit
      - name: Initialize bounded diagnostic evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ott-color-cost/evidence"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          keys = ("GITHUB_SHA", "GITHUB_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT",
                  "GITHUB_WORKFLOW_REF", "RUNNER_OS", "RUNNER_ARCH", "RUNNER_ENVIRONMENT")
          evidence = Path(os.environ["RUNNER_TEMP"]) / "ott-color-cost" / "evidence"
          evidence.joinpath("workflow-context.json").write_text(
              json.dumps({key: os.environ.get(key) for key in keys}, indent=2) + "\n")
          PY
      - name: Checkout experiment controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 14ea5da80b20a8311bb55cee250f794ae278d310
          path: source
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Measure feature cost and preserve original failures
        timeout-minutes: 25
        shell: bash
        env:
          COLOR_COST_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          set -o pipefail
          python3 control/.github/experiments/color-cost/compare.py "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/ott-color-cost" 2>&1 | tee "$RUNNER_TEMP/ott-color-cost/evidence/harness.log"
      - name: Preserve comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: client-color-cost-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ott-color-cost/evidence
          if-no-files-found: error
          retention-days: 7
