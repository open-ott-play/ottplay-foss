name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build player bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript check
        run: npm run typecheck --ignore-scripts

      - name: Build bundle
        run: npm run build --ignore-scripts

      - name: Package deployable bundle
        run: |
          tar -czf ottplay-foss-dist.tar.gz \
            index.html favicon.ico dist fonts js stb stbPlayer prov
          sha256sum ottplay-foss-dist.tar.gz > checksums.txt

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ottplay-foss-dist
          path: |
            ottplay-foss-dist.tar.gz
            checksums.txt
          retention-days: 30

  release:
    name: Attach bundle to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ottplay-foss-dist

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          mv ottplay-foss-dist/* dist/
          ls -la dist/

      - name: Create downloadable tarball
        run: |
          ls -la dist/ottplay-foss-dist.tar.gz || echo "Tarball not found"

      - name: Detect Prerelease
        id: detect
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [[ "$TAG" =~ -(alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Draft until tauri+mobile finish — avoids a public release that only has
      # dist/IPA/APK for ~10–15 min while macOS .app.zip/.dmg are still building.
      - name: Create Release (draft)
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          draft: true
          prerelease: ${{ steps.detect.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/ottplay-foss-dist.tar.gz
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tauri:
    name: Build Tauri (${{ matrix.platform }} ${{ matrix.target || 'host' }})
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-latest
            target: ''
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: windows-latest
            target: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable

      - name: Install Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
          shared-key: tauri-${{ matrix.platform }}-${{ matrix.target || 'host' }}

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-latest' || matrix.platform == 'ubuntu-24.04-arm'
        run: bash scripts/ci-tauri-linux-deps.sh

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build --ignore-scripts

      # Optional secrets (all skip-safe when absent):
      #   TAURI_SIGNING_PRIVATE_KEY[+_PASSWORD] — updater .sig + createUpdaterArtifacts
      #   APPLE_CERTIFICATE[+_PASSWORD], APPLE_SIGNING_IDENTITY — macOS codesign
      #   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID — notarization
      # Map APPLE_APP_SPECIFIC_PASSWORD -> APPLE_PASSWORD (what Tauri CLI expects).
      - name: Detect optional signing / notarize secrets
        id: signs
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "tauri_signing=true" >> "$GITHUB_OUTPUT"
            echo "Updater signing key present — will create updater artifacts"
          else
            echo "tauri_signing=false" >> "$GITHUB_OUTPUT"
            echo "No TAURI_SIGNING_PRIVATE_KEY — unsigned updater artifacts skipped"
          fi
          if [ "${{ matrix.platform }}" = "macos-latest" ] \
            && [ -n "${APPLE_CERTIFICATE:-}" ] \
            && [ -n "${APPLE_ID:-}" ] \
            && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] \
            && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "apple_notarize=true" >> "$GITHUB_OUTPUT"
            echo "Apple signing+notarize secrets present"
          else
            echo "apple_notarize=false" >> "$GITHUB_OUTPUT"
            echo "Apple notarize secrets absent or non-macOS — unsigned macOS path"
          fi

      - name: Import Apple certificate (optional)
        if: steps.signs.outputs.apple_notarize == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Throwaway keychain; never echo cert/password material.
          CERT_PATH="$RUNNER_TEMP/apple_cert.p12"
          KEYCHAIN="$RUNNER_TEMP/ottplay-signing.keychain-db"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          KC_PASS="${KEYCHAIN_PASSWORD:-$(openssl rand -base64 32)}"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$CERT_PATH" -P "${APPLE_CERTIFICATE_PASSWORD:-}" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN"
          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build desktop package
        shell: bash
        run: |
          EXTRA_CONFIG=()
          if [ "${TAURI_SIGNING:-}" = "true" ]; then
            EXTRA_CONFIG+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi

          # Apple notarize: only pass APPLE_* env when all secrets present.
          # Otherwise leave them unset so Tauri does not attempt codesign/notarize.
          if [ "${{ steps.signs.outputs.apple_notarize }}" = "true" ]; then
            export APPLE_CERTIFICATE="${{ secrets.APPLE_CERTIFICATE }}"
            export APPLE_CERTIFICATE_PASSWORD="${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            export APPLE_SIGNING_IDENTITY="${{ secrets.APPLE_SIGNING_IDENTITY }}"
            export APPLE_ID="${{ secrets.APPLE_ID }}"
            export APPLE_PASSWORD="${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
            export APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi

          if [ -n "${TAURI_TARGET:-}" ]; then
            npx tauri build --ci --target "$TAURI_TARGET" "${EXTRA_CONFIG[@]}"
          else
            npx tauri build --ci "${EXTRA_CONFIG[@]}"
          fi
        working-directory: src-tauri
        env:
          CI: true
          TAURI_TARGET: ${{ matrix.target }}
          TAURI_SIGNING: ${{ steps.signs.outputs.tauri_signing }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Cleanup Apple keychain (optional)
        if: always() && steps.signs.outputs.apple_notarize == 'true'
        shell: bash
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

      - name: Collect desktop bundles
        shell: bash
        run: bash scripts/ci-tauri-collect-artifacts.sh
        env:
          TAURI_TARGET: ${{ matrix.target }}

      - name: Upload desktop assets to release
        if: hashFiles('tauri-artifacts/*') != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: tauri-artifacts/*
          # macOS collect already failed if .app.zip/.dmg missing; non-macOS may
          # exit 0 with an empty dir (skip upload). Matched files must upload.
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobile:
    name: Build mobile (${{ matrix.type }})
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            type: ios
          - platform: ubuntu-latest
            type: android
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      # --------- iOS ---------
      - name: iOS – build web + sync
        if: matrix.type == 'ios'
        run: npm run build:mobile
        env:
          CI: true

      - name: iOS – discover scheme
        if: matrix.type == 'ios'
        id: discover
        run: |
          SCHEME=$(xcodebuild -list -project ios/App/App.xcodeproj | awk '/Schemes:/{getline; gsub(/^[ \t]+/,""); print; exit}')
          if [ -z "$SCHEME" ]; then
            echo "No scheme discovered via xcodebuild -list; falling back to App"
            SCHEME=App
          fi
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using scheme: $SCHEME"

      - name: iOS – archive (unsigned)
        if: matrix.type == 'ios'
        run: |
          SCHEME="${{ steps.discover.outputs.scheme }}"
          SCHEME="${SCHEME:-App}"
          DEST=$(xcodebuild -project "ios/App/App.xcodeproj" -scheme "$SCHEME" -sdk iphoneos -showDestinations 2>/dev/null | awk '/iOS Device/{print $NF; exit}')
          if [ -z "$DEST" ]; then
            echo "No iOS Device destination found; falling back to generic/platform=iOS"
            DEST="generic/platform=iOS"
          fi
          echo "Using destination: $DEST"
          xcodebuild clean archive \
            -project "ios/App/App.xcodeproj" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "${{ github.workspace }}/ottplay-foss-ios.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -destination "$DEST" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64

      - name: iOS – package IPA
        if: matrix.type == 'ios'
        run: |
          XCA="${{ github.workspace }}/ottplay-foss-ios.xcarchive"
          APP_DIR="$XCA/Products/Applications"
          if [ ! -d "$APP_DIR" ]; then
            echo "No .app found in archive at $APP_DIR"
            ls -R "$XCA"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_DIR/"*.app Payload/
          zip -qr "${{ github.workspace }}/ottplay-foss-ios-unsigned.ipa" Payload
          rm -rf Payload
          echo "Created ottplay-foss-ios-unsigned.ipa"

      - name: iOS – upload to release
        if: matrix.type == 'ios'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release.outputs.tag }}" \
            "${{ github.workspace }}/ottplay-foss-ios-unsigned.ipa" --clobber

      # --------- Android ---------
      - name: Android – setup Java
        if: matrix.type == 'android'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Android – setup SDK
        if: matrix.type == 'android'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Android – install SDK components
        if: matrix.type == 'android'
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "platform-tools" 2>&1 | tail -5
          echo "✓ Android SDK components installed"

      - name: Android – build web + sync
        if: matrix.type == 'android'
        run: npm run build:mobile
        env:
          CI: true

      - name: Android – assemble release
        if: matrix.type == 'android'
        run: |
          cd android
          ./gradlew assembleRelease
          # AAB optional; do not fail the job if bundle task is unavailable
          ./gradlew bundleRelease || echo "bundleRelease skipped"

      - name: Android – upload to release
        if: matrix.type == 'android'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          APK=$(find android/app/build/outputs/apk -name '*release*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "No release APK found"
            find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) || true
            exit 1
          fi
          OUT="$GITHUB_WORKSPACE/ottplay-foss-android-unsigned.apk"
          cp "$APK" "$OUT"
          UPLOAD=("$OUT")
          AAB=$(find android/app/build/outputs/bundle -name '*release*.aab' 2>/dev/null | head -1 || true)
          if [ -n "$AAB" ]; then
            AAB_OUT="$GITHUB_WORKSPACE/ottplay-foss-android-unsigned.aab"
            cp "$AAB" "$AAB_OUT"
            UPLOAD+=("$AAB_OUT")
          fi
          gh release upload "$RELEASE_TAG" "${UPLOAD[@]}" --clobber

  # Publish only after desktop+mobile attach; require macOS aarch64 .app.zip so
  # "Latest" never points at a release that is missing Tauri macOS assets.
  publish:
    name: Publish release
    needs: [release, tauri, mobile]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Verify macOS assets and undraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          TAURI_RESULT: ${{ needs.tauri.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
        run: |
          set -euo pipefail
          echo "tauri=$TAURI_RESULT mobile=$MOBILE_RESULT tag=$TAG"
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "Assets on draft release:"
          echo "$assets"
          echo "$assets" | grep -Fq 'ottplay-foss-dist.tar.gz'
          # Spaces may already be dots from collect sanitize / GitHub normalize
          if ! echo "$assets" | grep -Eiq 'aarch64-apple-darwin\.app\.zip'; then
            echo "ERROR: missing OttPlay.FOSS_aarch64-apple-darwin.app.zip (or space variant)" >&2
            echo "tauri job result was: $TAURI_RESULT" >&2
            exit 1
          fi
          if ! echo "$assets" | grep -Eiq 'aarch64.*apple-darwin\.dmg|apple-darwin.*aarch64\.dmg|_aarch64_.*\.dmg'; then
            echo "ERROR: missing aarch64 macOS .dmg" >&2
            exit 1
          fi
          gh release edit "$TAG" --draft=false
          echo "Published $TAG"
