name: Android Play upload bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/play-bundle.yml'
      - 'scripts/android/**'
      - 'tests/test_play_upload_signing.py'
      - 'android/**'
      - 'src/**'
      - 'prov/**'
      - 'scripts/*android*.cjs'
      - 'tests/android_provider_policy.cjs'
      - 'tests/test_play_system_icons.cjs'
      - 'scripts/play-system-icons.cjs'
      - 'scripts/native-*.cjs'
      - 'tests/test_native_runtime.cjs'
      - 'tests/test_frontend_safety.cjs'
      - 'package*.json'
      - 'stbPlayer/**'
      - 'fonts/**'
      - 'vite.config.ts'
      - 'docs/privacy-policy.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/play-bundle.yml'
      - 'scripts/android/**'
      - 'tests/test_play_upload_signing.py'

permissions:
  contents: read

jobs:
  signing-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify signing with disposable test keys
        run: python3 -m unittest discover -s tests -p test_play_upload_signing.py -v

  play-bundle:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: signing-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Sync native plugins without shared frontend assets
        run: |
          npm ci --ignore-scripts
          node tests/android_provider_policy.cjs
          node scripts/build-android.cjs sync
      - name: Build unsigned Play distribution
        working-directory: android
        run: env -u KEYSTORE_FILE -u KEYSTORE_PASSWORD -u KEY_ALIAS -u KEY_PASSWORD ./gradlew --no-daemon :app:bundlePlayRelease
      - name: Audit packaged Play content before signing
        run: |
          node scripts/verify-android-distribution.cjs android/app/build/outputs/bundle/playRelease/app-play-release.aab play
          node tests/test_play_system_icons.cjs --bundle android/app/build/generated/ottplay/play/assets/public/dist/stbPlayer.js
          npm run test:native:runtime
          OTTPLAY_TEST_JQUERY=android/app/build/generated/ottplay/play/assets/public/js/jquery.min.js node tests/test_frontend_safety.cjs --bundle android/app/build/generated/ottplay/play/assets/public/dist/stbPlayer.js
      - name: Sign and verify Play upload bundle
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          python3 scripts/android/sign-play-bundle.py \
            android/app/build/outputs/bundle/playRelease/app-play-release.aab \
            ottplay-foss-android-play-upload.aab
          node scripts/verify-android-distribution.cjs ottplay-foss-android-play-upload.aab play
      - name: Upload verified bundle for manual Play Console submission
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ottplay-play-upload-${{ github.sha }}
          path: ottplay-foss-android-play-upload.aab
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary upload keys
        if: always()
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import shutil
          for directory in Path(os.environ["RUNNER_TEMP"]).glob("ott-play-upload-*"):
              if directory.is_dir() and not directory.is_symlink():
                  shutil.rmtree(directory)
          PYTHON
